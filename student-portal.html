<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow">
  <title>Mi grupo | Spanish with Elkin</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;color:#172554;background:#f8fafc}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1000px)/2));background:#fff;border-bottom:1px solid #e2e8f0;font-weight:800}header span{color:#f97316}button{font:inherit;border:1px solid #cbd5e1;border-radius:999px;padding:9px 15px;background:#fff;color:#172554;font-weight:700;cursor:pointer}.shell{width:min(1000px,calc(100% - 32px));margin:42px auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:28px;box-shadow:0 14px 45px rgba(15,23,42,.06)}h1{margin-top:0;font-size:2rem}.muted{color:#64748b}.status{display:inline-block;padding:6px 11px;border-radius:999px;background:#fff7ed;color:#c2410c;font-weight:800;font-size:.75rem}.sessions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.session{padding:16px;border-radius:14px;background:#eff6ff}.session small{display:block;color:#64748b}.hidden{display:none}.message{padding:16px;border-radius:14px;background:#fef2f2;color:#b91c1c}@media(max-width:650px){.sessions{grid-template-columns:1fr 1fr}h1{font-size:1.55rem}}</style>
</head>
<body>
  <header><div>Spanish with <span>Elkin</span> · Mi portal</div><button id="sign-out" type="button">Cerrar sesión</button></header>
  <main class="shell">
    <section id="loading" class="card"><p>Cargando tu acceso…</p></section>
    <section id="pending" class="card hidden"><span class="status">PENDIENTE</span><h1>Tu solicitud está en revisión</h1><p class="muted">Elkin está verificando la referencia de pago y tu grupo. Podrás ver el calendario cuando el acceso sea aprobado.</p></section>
    <section id="active" class="card hidden"><span class="status">ACCESO ACTIVO</span><h1 id="group-name"></h1><p id="group-slot" class="muted"></p><div id="sessions" class="sessions"></div></section>
    <p id="error" class="message hidden"></p>
  </main>
  <script type="module" src="student-portal.js?v=20260824-1"></script>
</body>
</html>
